name: 'health_analytics'
profile: 'health_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Staging models rename and cast the raw CSV columns. They are materialized
# as tables rather than the conventional views because the sources are CSV
# files read in place: a view would re-parse the file on every query and
# would carry a path that only resolves from the repo root.
models:
  health_analytics:
    staging:
      +materialized: table
    marts:
      +materialized: table
