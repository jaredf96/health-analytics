# Builds the project the same way the README tells a reader to build it:
# fetch the Synthea CSVs, run dbt build, then run the analyses that reproduce
# the decision log's profiles of feeds no model reads. On a push to main it
# also generates the dbt docs and publishes them to GitHub Pages.
name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every step runs from the repo root, as the README tells a reader to: dbt
# finds the project and the repo-local profiles.yml in the working directory,
# and the DuckDB file and the source CSVs are paths relative to it.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned dependencies
        run: pip install -r requirements.txt

      # The fetch script pins the archive URL and its SHA-256, so hashing the
      # script is enough to invalidate this cache when the dataset changes.
      - name: Restore the Synthea CSVs
        uses: actions/cache@v6
        with:
          path: data/raw/synthea
          key: synthea-${{ hashFiles('scripts/fetch_synthea.py') }}

      - name: Fetch the Synthea CSVs
        run: python scripts/fetch_synthea.py

      # Two warnings are expected and correct: the post-death encounter test in
      # docs/DECISIONS.md section 15, and the inpatient length-of-stay
      # plausibility test in section 25. Both pin the count they tolerate and
      # error above it, section 26, so a growing defect fails this step rather
      # than warning louder. dbt exits 0 on a warning and non-zero on an error.
      - name: Build and test
        run: dbt build --no-partial-parse

      # docs/DECISIONS.md sections 8 and 24 profile feeds no model reads, so no
      # test covers them. These analyses reproduce the figures without
      # asserting them, section 29. Running them here keeps them runnable, and
      # their figures print in this log.
      - name: Reproduce the source profiles
        run: |
          dbt show --select profile_claims --limit 50 --output json
          dbt show --select profile_payer_transitions --limit 50 --output json

      - name: Generate the docs site
        if: github.event_name == 'push'
        run: |
          dbt docs generate --static --no-partial-parse
          mkdir -p docs-site
          cp target/static_index.html docs-site/index.html

      - name: Upload the docs site
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site

  # Gated on the repository being public, because GitHub Pages is not
  # available on a private repository on the Free plan and deploy-pages would
  # fail the run for a reason that is not a defect. Making the repository
  # public turns this gate on with no edit here. Pages itself still has to be
  # enabled once in Settings, with its source set to GitHub Actions, or
  # deploy-pages returns 404.
  publish-docs:
    needs: build
    if: github.event_name == 'push' && github.event.repository.private == false
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
