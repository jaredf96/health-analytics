version: 2

sources:
  - name: synthea
    description: >
      Synthea synthetic EHR sample published by MITRE
      (synthea_sample_data_csv_nov2021.zip, 1,163 patients, Massachusetts).
      Entirely synthetic: no real patients, no PHI. scripts/fetch_synthea.py
      lands the CSVs in data/raw/synthea/ and dbt-duckdb reads them in place.
      Every column arrives as text; typing happens in the staging layer, or in
      the analysis that reads a feed declared only to be profiled.
    meta:
      external_location: "read_csv('data/raw/synthea/{name}.csv', header=true, all_varchar=true)"
    tables:
      - name: claims
        description: >
          One row per claim, each against one encounter through APPOINTMENTID.
          Declared only so analyses/profile_claims.sql can reproduce the profile
          in docs/DECISIONS.md section 8; no model reads it. Section 29.

      - name: claims_transactions
        description: >
          One row per claim transaction, typed CHARGE, PAYMENT, TRANSFERIN or
          TRANSFEROUT. Declared only so analyses/profile_claims.sql can
          reproduce the profile in docs/DECISIONS.md section 8; no model reads
          it. Section 29.

      - name: conditions
        description: >
          One row per condition recorded for a patient at an encounter. The
          file carries no key column; PATIENT, ENCOUNTER and CODE together
          identify a row.
        columns:
          - name: PATIENT
            description: Patient UUID.
            data_tests:
              - not_null
          - name: ENCOUNTER
            description: Encounter UUID the condition was recorded at.
            data_tests:
              - not_null

      - name: encounters
        description: One row per patient visit, with its class, cost, and the organization, provider and payer involved.
        columns:
          - name: Id
            description: Encounter UUID, primary key.
            data_tests:
              - unique
              - not_null

      - name: organizations
        description: One row per care organization, with address and lifetime utilization.
        columns:
          - name: Id
            description: Organization UUID, primary key.
            data_tests:
              - unique
              - not_null

      - name: patients
        description: One row per synthetic patient with demographics, address, and lifetime cost totals.
        columns:
          - name: Id
            description: Patient UUID, primary key.
            data_tests:
              - unique
              - not_null

      - name: payer_transitions
        description: >
          One row per coverage span: a patient, a range of years, a primary
          payer and any secondary payer. Declared only so
          analyses/profile_payer_transitions.sql can reproduce the figures in
          docs/DECISIONS.md section 24; no model reads it. Section 29.

      - name: payers
        description: One row per insurance payer, with headquarters address and lifetime coverage totals.
        columns:
          - name: Id
            description: Payer UUID, primary key.
            data_tests:
              - unique
              - not_null

      - name: providers
        description: One row per clinician, each attached to one organization.
        columns:
          - name: Id
            description: Provider UUID, primary key.
            data_tests:
              - unique
              - not_null
